{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Employee</title>

    <link rel="stylesheet" href="{% static 'dashboard/dashboard.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="main-container">

    <div class="sidebar">
        <div class="logo">HCQ <br> MARKETING</div>

        <div class="menu">
            <a href="/dashboard/" class="menu-link">
                <div class="menu-item"><i class="fa-solid fa-house"></i> Dashboard</div>
            </a>

            <a href="/attendance-page/" class="menu-link">
                <div class="menu-item"><i class="fa-solid fa-check"></i> Attendance</div>
            </a>

            <a href="/employees-page/" class="menu-link">
                <div class="menu-item active"><i class="fa-solid fa-user"></i> Employees</div>
            </a>

            <a href="/admin/payroll/" class="menu-link">
                <div class="menu-item"><i class="fa-solid fa-file"></i> Payroll</div>
            </a>
        </div>
    </div>

    <div class="content new-employee-content">

        <div class="new-employee-header">
            <h1>NEW EMPLOYEE</h1>

            <div class="logout">
                <a href="{% url 'admin:logout' %}">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <form class="new-employee-form">

            <div class="employee-form-layout">

                <div class="left-upload-area">
                    <div class="image-placeholder"></div>

                    <label class="upload-label">
                        Upload Image <i class="fa-solid fa-upload"></i>
                        <input type="file" hidden>
                    </label>

                    <label class="upload-label">
                        Upload Documents <i class="fa-solid fa-upload"></i>
                        <input type="file" hidden>
                    </label>
                </div>

                <div class="form-main-area">

                    <div class="form-section">
                        <h3>PERSONAL INFORMATION</h3>

                        <div class="two-column-form">
                            <div>
                                <label>First Name</label>
                                <input type="text">

                                <label>Middle Initial</label>
                                <input type="text">

                                <label>Last Name</label>
                                <input type="text">

                                <label>Birthday</label>
                                <input type="date">

                                <label>Citizenship</label>
                                <input type="text">
                            </div>

                            <div>
                                <label>Address</label>
                                <input type="text">

                                <label>Contact No.</label>
                                <input type="text">

                                <label>Spouse Name</label>
                                <input type="text">

                                <label>Contact No.</label>
                                <input type="text">
                            </div>
                        </div>
                    </div>

                    <div class="bottom-grid">

                        <div>
                            <div class="form-section">
                                <h3>EDUCATIONAL INFORMATION</h3>

                                <div class="school-row">
                                    <label>Elementary</label>
                                    <input type="text">
                                    <label>Year Attended</label>
                                    <input type="text">
                                </div>

                                <div class="school-row">
                                    <label>High School</label>
                                    <input type="text">
                                    <label>Year Attended</label>
                                    <input type="text">
                                </div>

                                <div class="school-row">
                                    <label>College</label>
                                    <input type="text">
                                    <label>Year Attended</label>
                                    <input type="text">
                                </div>
                            </div>

                            <div class="form-section">
                                <h3>EMPLOYMENT HISTORY</h3>

                                <div class="history-grid">
                                    <input type="text" placeholder="Name of Company">
                                    <input type="text" placeholder="Address">
                                    <input type="text" placeholder="Occupation">
                                    <input type="text" placeholder="Years">

                                    <input type="text">
                                    <input type="text">
                                    <input type="text">
                                    <input type="text">

                                    <input type="text">
                                    <input type="text">
                                    <input type="text">
                                    <input type="text">
                                </div>
                            </div>
                        </div>

                        <div>
                            <div class="form-section">
                                <h3>CHARACTER REFERENCE</h3>

                                <div class="reference-grid">
                                    <input type="text" placeholder="Name">
                                    <input type="text" placeholder="Occupation">
                                    <input type="text" placeholder="Contact Number">

                                    <input type="text" placeholder="Name">
                                    <input type="text" placeholder="Occupation">
                                    <input type="text" placeholder="Contact Number">

                                    <input type="text" placeholder="Name">
                                    <input type="text" placeholder="Occupation">
                                    <input type="text" placeholder="Contact Number">
                                </div>
                            </div>

                            <div class="work-position-box">
                                <h3>WORK POSITION</h3>

                                <label>Position</label>
                                <input type="text">

                                <label>Salary Rate</label>
                                <input type="number">

                                <label>Date Started</label>
                                <input type="date">
                            </div>
                        </div>

                    </div>

                    <div class="form-actions">
                        <button type="button">Save Employee</button>
                    </div>

                </div>

            </div>

        </form>

    </div>

</div>

</body>
</html>
