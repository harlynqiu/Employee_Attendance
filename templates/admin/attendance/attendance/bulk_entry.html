{% extends "admin/base_site.html" %}

{% block content %}
    <h1>Bulk Attendance Entry</h1>

    <form method="post" style="padding: 15px; background: #fff; border: 1px solid #ddd; border-radius: 8px;">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="button" style="padding:8px 12px;">
            Save Attendance
        </button>

        <a href="{% url 'admin:attendance_attendance_changelist' %}" class="button" style="padding:8px 12px;">
            Back to Attendance
        </a>
    </form>
{% endblock %}
