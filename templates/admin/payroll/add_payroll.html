{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Payroll</title>

    <link rel="stylesheet" href="{% static 'dashboard/dashboard.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .form-card {
            background: white;
            border: 1px solid #dfe7f3;
            border-radius: 22px;
            padding: 30px;
            max-width: 900px;
        }

        .form-title {
            font-size: 42px;
            font-weight: 900;
            color: #061b49;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 900;
            color: #061b49;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 14px;
            border: 1px solid #d9e2f1;
            border-radius: 14px;
            font-size: 15px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .button-row {
            margin-top: 28px;
            display: flex;
            gap: 14px;
        }

        .save-btn {
            background: #0758d6;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 900;
            cursor: pointer;
        }

        .back-btn {
            background: #eef5ff;
            color: #0758d6;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 900;
        }
    </style>
</head>

<body>

<div class="modern-page">

    <aside class="modern-sidebar">
        <div class="modern-logo">HCQ <br> MARKETING</div>

        <nav class="modern-menu">
            <a href="/dashboard/"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
            <a href="/attendance-page/"><i class="fa-solid fa-circle-check"></i><span>Attendance</span></a>
            <a href="/employees-page/"><i class="fa-solid fa-user"></i><span>Employees</span></a>
            <a href="/payroll-page/" class="active"><i class="fa-regular fa-file-lines"></i><span>Payroll</span></a>
        </nav>
    </aside>

    <main class="modern-content">

        <h1 class="form-title">ADD PAYROLL</h1>

        <form method="post" class="form-card">
            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group full">
                    <label>Employee</label>
                    <select name="employee" required>
                        <option value="">Select Employee</option>
                        {% for employee in employees %}
                            <option value="{{ employee.id }}">
                                {{ employee.employee_id }} - {{ employee.last_name }}, {{ employee.first_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" name="start_date" required>
                </div>

                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" name="end_date" required>
                </div>

                <div class="form-group">
                    <label>Allowance</label>
                    <input type="number" step="0.01" name="allowance" value="0">
                </div>

                <div class="form-group">
                    <label>Cash Advance</label>
                    <input type="number" step="0.01" name="cash_advance" value="0">
                </div>

                <div class="form-group">
                    <label>Charges</label>
                    <input type="number" step="0.01" name="charges" value="0">
                </div>

                <div class="form-group">
                    <label>Rent</label>
                    <input type="number" step="0.01" name="rent" value="0">
                </div>

                <div class="form-group full">
                    <label>Remarks</label>
                    <textarea name="remarks" rows="4"></textarea>
                </div>

            </div>

            <div class="button-row">
                <button type="submit" class="save-btn">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Payroll
                </button>

                <a href="/payroll-page/" class="back-btn">
                    Back
                </a>
            </div>
        </form>

    </main>

</div>

</body>
</html>
